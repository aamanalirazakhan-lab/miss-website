<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Something For You</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         INTRO SCREEN
    ========================== -->

    <section id="intro" class="screen intro-screen">

        <div class="intro-content">

            <div class="small-text">
                I HAVE SOMETHING FOR YOU
            </div>

            <h1>
                A Little<br>
                Surprise
            </h1>

            <p>
                Open this when you're ready...
            </p>

            <button id="openBtn" class="open-btn">
                Open
                <span>♡</span>
            </button>

        </div>

    </section>


    <!-- =========================
         MAIN EXPERIENCE
    ========================== -->

    <section id="main" class="screen main-screen">

        <!-- floating particles -->
        <div id="particles"></div>

        <!-- Moon -->
        <div class="moon"></div>

        <!-- Stars -->
        <div class="stars"></div>


        <!-- Message -->

        <div class="message">

            <div class="tiny-title">
                FOR YOU
            </div>

            <h2>
                I REALLY
                <span class="heart">MISS YOU</span>
                SO MUCH
            </h2>

            <p>
                Some people make ordinary days<br>
                feel a little more beautiful.
            </p>

        </div>


        <!-- Flower field -->

        <div class="garden">

            <div class="grass"></div>

            <div class="flower flower-1">
                <div class="stem"></div>
                <div class="petals">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="center"></div>
            </div>


            <div class="flower flower-2">
                <div class="stem"></div>
                <div class="petals">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="center"></div>
            </div>


            <div class="flower flower-3">
                <div class="stem"></div>
                <div class="petals">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="center"></div>
            </div>


            <div class="flower flower-4">
                <div class="stem"></div>
                <div class="petals">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="center"></div>
            </div>


            <div class="flower flower-5">
                <div class="stem"></div>
                <div class="petals">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="center"></div>
            </div>

        </div>


        <!-- Controls -->

        <div class="controls">

            <button class="color-btn pink" data-color="pink"></button>

            <button class="color-btn red" data-color="red"></button>

            <button class="color-btn purple" data-color="purple"></button>

            <button class="color-btn blue" data-color="blue"></button>

            <button class="color-btn yellow" data-color="yellow"></button>

        </div>


        <button id="againBtn" class="again-btn">
            Replay
        </button>

    </section>


    <script src="script.js"></script>

</body>
</html>
